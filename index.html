<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Padded SVG favicon preferred (adds a small gap so the shield reads at
         tab size); PNG kept as a fallback for browsers without SVG icons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Svastrino — futuristic career mentoring & courses. Personalised guidance, mentoring programs, and the Nirmaan course."
    />

    <!-- Brand fonts: Inter (body) + Poppins (headings). The design tokens in
         theme.css reference these; preconnect + a single stylesheet keeps the
         request cheap. Devanagari subset covers the Hindi taglines. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap"
    />
    <title>Svastrino — Career Mentoring & Courses</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
