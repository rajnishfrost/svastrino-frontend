# =============================================================================
# Deploy the Svastrino React app to S3 + CloudFront
# =============================================================================
# Triggered by a push to `production`. Builds with Vite, syncs dist/ to the
# frontend bucket, and invalidates the CDN.
#
# Authentication is OIDC - no AWS keys are stored in this repo. The role's trust
# policy pins this repo AND this branch.
#
# Repository variables required (Settings -> Secrets and variables -> Actions):
#   AWS_DEPLOY_ROLE = arn:aws:iam::559258887400:role/svastrino-prod-gha-client-deploy
#                     (terraform output github_client_deploy_role_arn)
#   S3_BUCKET       = svastrino-prod-frontend          (terraform output frontend_bucket)
#   CF_DISTRIBUTION = E...                             (terraform output cloudfront_distribution_id)
# Repository secret required:
#   VITE_GOOGLE_CLIENT_ID = the Google OAuth client id (baked in at BUILD time,
#                           so it cannot come from Secrets Manager like the
#                           server's config does)
#
# Note there is no VITE_API_BASE: the client falls back to the relative path
# /api (src/api/client.js), and CloudFront routes /api/* to the ALB on the same
# domain. Same origin means no CORS and nothing to configure per environment.
# =============================================================================
name: Deploy Web

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true # a newer build supersedes an in-flight one

env:
  AWS_REGION: ap-south-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      # Write real HTML for every page in the sitemap. Google runs JavaScript
      # eventually; the crawlers behind WhatsApp, LinkedIn and X never do, so
      # without this every shared link previews as the same site name. Chrome
      # ships on the GitHub runner — this only points Puppeteer at it.
      #
      # Skipped rather than failed if it cannot run: a deploy that ships the
      # plain SPA is a worse site, not a broken one, and blocking a release on
      # a headless browser is the wrong trade.
      - name: Prerender pages
        continue-on-error: true
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          # The pages need real content while they render, and CI has no local
          # API — so it reads from the deployed one.
          PRERENDER_API: ${{ vars.PRERENDER_API || 'https://d1d66ne3xrrmwd.cloudfront.net' }}
        run: npm run prerender

      # The distribution answers a missed address with /404.html, and serves
      # every signed-in route from /app.html. Prerendering writes both, and is
      # allowed to fail — so if it did, stop here rather than sync a dist/
      # without them: --delete would take the live copies down with it, and the
      # 404 rule would be left pointing at a file that no longer exists.
      - name: Check the prerender produced what CloudFront depends on
        run: |
          for f in dist/404.html dist/app.html; do
            [ -s "$f" ] || {
              echo "::error::$f is missing — the prerender step did not finish"
              exit 1
            }
          done
          echo "✓ $(ls -d dist/*/index.html 2>/dev/null | wc -l) pages, plus 404.html and app.html"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Two passes, because the right cache header differs per file type.
      #
      # Pass 1: everything with a content hash in its name (Vite puts these in
      # assets/) can be cached forever - a new build produces new filenames.
      - name: Upload hashed assets (immutable)
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "*index.html" \
            --exclude "sw.js" \
            --exclude "*.webmanifest" \
            --exclude "404.html" \
            --exclude "app.html" \
            --exclude "__shell.html" \
            --cache-control "public,max-age=31536000,immutable"

      # __shell.html is the prerender step's own scratch copy of the unrendered
      # build. It has no business being reachable — served, it is a second copy
      # of the site with no content in it — and an excluded file is not one
      # --delete removes, so it is deleted by name.
      - name: Remove the prerender scratch file from the bucket
        run: |
          aws s3 rm "s3://${{ vars.S3_BUCKET }}/__shell.html" --only-show-errors || true

      # "*index.html", not "index.html": prerendering writes one per page, at
      # law/index.html and 290 others. Matching only the root left every other
      # page marked immutable for a year — an edit to any of them would never
      # reach anyone, because the name it is cached under never changes.
      #
      # Pass 2: the entry point and the service worker keep their NAMES across
      # builds, so caching them would pin users to the old app. This is a PWA
      # (vite-plugin-pwa, registerType autoUpdate) - a stale sw.js is especially
      # bad because the service worker then keeps serving the old shell offline.
      #
      # 404.html and app.html keep their names too, and are the same kind of
      # file as index.html — one is what a missing address answers with, the
      # other is what every signed-in route is served from.
      - name: Upload entry point and service worker (no-cache)
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --exclude "*" \
            --include "*index.html" \
            --include "sw.js" \
            --include "*.webmanifest" \
            --include "404.html" \
            --include "app.html" \
            --cache-control "no-cache,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CF_DISTRIBUTION }}" \
            --id "$ID"
